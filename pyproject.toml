[project]
name = "railblock-ai"
version = "0.1.0"
description = "Explainable automatic maintenance block planning prototype for SIH26027"
requires-python = ">=3.11"
dependencies = [
  "streamlit>=1.62,<2",
  "pandas>=2.2,<3",
  "plotly>=5.24,<7",
  "ortools>=9.11,<10",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
